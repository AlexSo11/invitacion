<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Party | Invitación Especial</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f6f0ea;
      --card-bg: #ffffff;
      --text-main: #332C2B;
      --accent-color: #8C4343;
      --accent-light: #f4eae1;
      --font-title: 'Cormorant Garamond', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fondo con imagen aesthetic / textura suave */
    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(244, 234, 225, 0.8) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(230, 215, 205, 0.6) 0%, transparent 40%),
        url('https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 15px;
      position: relative;
    }

    /* Capa suave para difuminar la imagen de fondo */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(250, 246, 240, 0.75);
      backdrop-filter: blur(5px);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(140, 67, 67, 0.15);
      animation: fadeIn 1.2s ease-in-out;
      overflow: hidden;
    }

    .bow-icon {
      font-size: 1.8rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      display: inline-block;
    }

    .subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888;
      margin-bottom: 6px;
    }

    /* Única tipografía diferente */
    .title {
      font-family: var(--font-title);
      font-size: 3rem;
      font-weight: 400;
      font-style: italic;
      color: var(--accent-color);
      line-height: 1;
      margin-bottom: 24px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px auto;
      color: var(--accent-color);
      opacity: 0.6;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 40px;
      background-color: var(--accent-color);
    }

    /* Cuenta regresiva */
    .countdown-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #999;
      margin-bottom: 10px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .time-box {
      background: var(--accent-light);
      padding: 10px 8px;
      border-radius: 12px;
      flex: 1;
      max-width: 75px;
    }

    .time-box .number {
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    .time-box .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
    }

    /* Información General */
    .info-section {
      margin-bottom: 24px;
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #777;
      margin-bottom: 6px;
    }

    .time-date {
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .info-value {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 400;
    }

    /* Botones */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
      padding: 14px 20px;
      background-color: var(--accent-color);
      color: #FFF;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(140, 67, 67, 0.2);
    }

    .btn-action:hover {
      background-color: #6d3333;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: var(--accent-light);
    }

    /* Paleta de colores */
    .palette-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #FFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="bow-icon">🎀</div>
    <p class="subtitle">Estás cordialmente invitado/a a mi</p>
    <h1 class="title">Birthday Party</h1>

    <!-- Cuenta Regresiva -->
    <p class="countdown-title">Faltan tan solo:</p>
    <div class="countdown">
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">Días</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">Hs</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">Min</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">Seg</div>
      </div>
    </div>

    <div class="divider">✦ ✦ ✦</div>

    <!-- Detalles del Evento -->
    <div class="info-section">
      <p class="subtitle"><strong>19 de Diciembre, 2026</strong></p>
      <p class="subtitle">A las 2:30 PM</p>
    </div>

    <div class="info-section">
      <p class="subtitle">Paseo de los Artistas 1216A</p>
      <a 
        href="https://maps.google.com/?cid=9950386319637510619" 
        target="_blank" 
        class="btn-action btn-secondary"
      >
        📍 Ver Ubicación en Maps
      </a>
    </div>

    <!-- Dresscode -->
    <div class="info-section">
      <p class="info-label">👗 Código de Vestimenta</p>
      <p class="subtitle">Formal / Semi-formal</p>
      <div class="palette-container">
        <div class="swatch" style="background-color: #5C4033;" title="Chocolate"></div>
        <div class="swatch" style="background-color: #FAF0E6;" title="Cream"></div>
        <div class="swatch" style="background-color: #B0C4DE;" title="Soft Blue"></div>
        <div class="swatch" style="background-color: #D8BFD8;" title="Lilac"></div>
        <div class="swatch" style="background-color: #FFB6C1;" title="Soft Pink"></div>
      </div>
    </div>

    <div class="divider">✦</div>
  </div>

  <!-- JavaScript para la Cuenta Regresiva -->
  <script>
    // Fecha objetivo
    const targetDate = new Date(2026, 11, 19, 14, 30, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
      } else {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
